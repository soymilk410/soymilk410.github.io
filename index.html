<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Writeup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            background: #ffffff;
            color: #111;
            padding: 64px 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 80px;
        }
        .header h1 {
            font-size: 88px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .header p {
            font-size: 26px;
            color: #777;
        }
        .card-wrap {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 48px 40px;
            background: #f8f8f8;
            border-radius: 32px;
            text-decoration: none;
            color: #000;
        }
        .card-name {
            font-size: 56px;
            font-weight: 700;
        }
        .card-count {
            font-size: 32px;
            background: #fff;
            padding:14px 36px;
            border-radius: 999px;
            border:1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CTF Writeup</h1>
        <p>刷题笔记｜总题数：<span id="total-num">0</span></p>
    </div>
    <div class="card-wrap">
        <a class="card" href="list.html?type=ctfhub">
            <span class="card-name">CTFHub</span>
            <span class="card-count" id="ctfhub-count">0题</span>
        </a>
        <a class="card" href="list.html?type=bugku">
            <span class="card-name">Bugku</span>
            <span class="card-count" id="bugku-count">0题</span>
        </a>
    </div>

<script>
// ========= 帖子列表，所有题目已全部录入 =========
const writeups = [
    // Bugku
    {type:"bugku", title:"点击查看我的第一个帖子", file:"post1.md", date:""},
    {type:"bugku", title:"滑稽", file:"writeup1.md", date:"2026.09.12"},
    {type:"bugku", title:"计算机", file:"writeup2.md", date:"2026.09.12"},
    {type:"bugku", title:"alert", file:"writeup3.md", date:"2026.09.14"},
    {type:"bugku", title:"你必须让他停下来", file:"writeup4.md", date:"2026.09.15"},
    {type:"bugku", title:"头等舱", file:"writeup5.md", date:"2026.09.16"},
    {type:"bugku", title:"GET", file:"writeup6.md", date:"2026.09.17"},
    {type:"bugku", title:"POST", file:"writeup7.md", date:"2026.09.17"},
    {type:"bugku", title:"Ook.", file:"writeup8.md", date:"2026.09.18"},
    {type:"bugku", title:"[+-<>]", file:"writeup9.md", date:"2026.09.18"},
    {type:"bugku", title:"/.‑", file:"writeup10.md", date:"2026.09.18"},
    {type:"bugku", title:"聪明的小羊", file:"writeup11.md", date:"2026.09.19"},
    {type:"bugku", title:"这是一张照片", file:"writeup12.md", date:"2026.09.21"},
    {type:"bugku", title:"富强民主", file:"writeup13.md", date:"2026.09.22"},
    {type:"bugku", title:"散落的密文", file:"writeup14.md", date:"2026.09.22"},
    {type:"bugku", title:"!?", file:"writeup15.md", date:"2026.09.22"},
    {type:"bugku", title:"矛盾", file:"writeup16.md", date:"2026.09.23"},
    {type:"bugku", title:"备份是个好习惯", file:"writeup17.md", date:"2026.09.24"},
    {type:"bugku", title:"变量1", file:"writeup18.md", date:"2026.09.24"},
    {type:"bugku", title:"本地管理员", file:"writeup19.md", date:"2026.09.24"},
    {type:"bugku", title:"源代码", file:"writeup20.md", date:"2026.09.25"},
    // CTFHub
    {type:"ctfhub", title:"HTTP Method", file:"writeupone.md", date:"2026.09.25"},
];
// =============================================

// 自动计算数量
const bugkuList = writeups.filter(x=>x.type==="bugku");
const ctfhubList = writeups.filter(x=>x.type==="ctfhub");
document.getElementById("total-num").innerText = writeups.length;
document.getElementById("bugku-count").innerText = bugkuList.length + "题";
document.getElementById("ctfhub-count").innerText = ctfhubList.length + "题";

// 把数据存到浏览器，list页面读取
localStorage.setItem("writeupData", JSON.stringify(writeups));
</script>
</body>
</html>
