<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writeup List</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            background:#fff;
            padding:48px 24px;
            max-width:900px;
            margin:0 auto;
        }
        .back {
            font-size:22px;
            color:#333;
            text-decoration:none;
            margin-bottom:32px;
            display:inline-block;
        }
        h2 {
            font-size:64px;
            margin-bottom:12px;
        }
        .progress-text {
            font-size:28px;
            color:#777;
            margin-bottom:40px;
        }
        .list-card {
            background:#f8f8f8;
            border-radius:32px;
            padding:32px 40px;
        }
        .item {
            font-size:32px;
            padding:16px 0;
            border-bottom:1px solid #ddd;
            cursor:pointer;
        }
        .item:last-child {
            border-bottom:none;
        }
        .item:hover {
            color:#4477dd;
        }
    </style>
</head>
<body>
    <a class="back" href="index.html">← 返回首页</a>
    <h2 id="page-title"></h2>
    <div class="progress-text" id="progress"></div>
    <div class="list-card" id="list-container"></div>

<script>
// 获取url参数
const params = new URLSearchParams(window.location.search);
const type = params.get("type");
const allData = JSON.parse(localStorage.getItem("writeupData"));
const currentList = allData.filter(x=>x.type === type);

let title;
if(type === "bugku") title = "Bugku Writeup";
if(type === "ctfhub") title = "CTFHub Writeup";
document.getElementById("page-title").innerText = title;
document.getElementById("progress").innerText = `当前进度：${currentList.length} / 30`;

const container = document.getElementById("list-container");
currentList.forEach((item, idx)=>{
    const div = document.createElement("div");
    div.className = "item";
    let text = "";
    if(item.date){
        text = `${idx+1}. ${item.title} 【${item.date}】`;
    }else{
        text = `${item.title}`;
    }
    div.innerText = text;
    div.onclick = ()=>{
        // 跳转到md预览页面，携带md文件名
        window.location.href = `viewer.html?md=${item.file}`;
    }
    container.appendChild(div);
})
</script>
</body>
</html>
