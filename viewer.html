<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writeup Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            background:#ffffff;
            padding:32px 24px;
            max-width: 900px;
            margin:0 auto;
        }
        .back {
            display:inline-block;
            margin-bottom:24px;
            font-size:20px;
            color:#333;
            text-decoration:none;
        }
        /* GitHub风格markdown渲染 */
        .markdown-body {
            padding:32px;
            border:1px solid #e5e7eb;
            border-radius:12px;
            background:#fff;
            line-height:1.7;
            font-size:16px;
        }
        .markdown-body h1 {
            font-size:2em;
            margin:0.67em 0;
            font-weight:600;
            border-bottom:1px solid #eee;
            padding-bottom:0.3em;
        }
        .markdown-body h2 {
            font-size:1.5em;
            margin:0.8em 0;
            font-weight:600;
            border-bottom:1px solid #eee;
            padding-bottom:0.3em;
        }
        .markdown-body h3 {
            font-size:1.25em;
            margin:1em 0;
            font-weight:600;
        }
        .markdown-body p {
            margin:1em 0;
        }
        .markdown-body pre {
            background:#f6f8fa;
            padding:16px;
            border-radius:6px;
            overflow:auto;
        }
        .markdown-body code {
            background:#f6f8fa;
            padding:0.2em 0.4em;
            border-radius:4px;
        }
        .markdown-body blockquote {
            border-left:4px solid #ddd;
            padding:0 1em;
            color:#656d76;
            margin:1em 0;
        }
    </style>
</head>
<body>
    <a class="back" href="javascript:history.back()">← 返回题目列表</a>
    <div class="markdown-body" id="md-view">加载中...</div>

<script>
const params = new URLSearchParams(window.location.search);
const mdFile = params.get("md");
const mdView = document.getElementById("md-view");

(async ()=>{
    try{
        const res = await fetch(mdFile);
        const text = await res.text();
        const html = marked.parse(text);
        mdView.innerHTML = html;
    }catch(err){
        mdView.innerHTML = `<div style="color:red;">加载失败！检查文件：${mdFile}</div>`;
    }
})()
</script>
</body>
</html>
